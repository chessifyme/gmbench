<line x1="696" y1="138" x2="696" y2="158" stroke="#3d444d" stroke-dasharray="3 3"/>
<text x="530.2" y="162" font-size="12.5" fill="#e6edf3" text-anchor="end">“clearly better” holds from +0.55 to +1.65: each band reaches 15 cp past its edges</text>
<text x="40" y="192" font-size="12" fill="#9198a1" text-anchor="start">An edge belongs to the band above it: +0.70 is a clear edge.</text>
