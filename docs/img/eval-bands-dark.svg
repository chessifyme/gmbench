<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 228" width="900" height="228" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">Evaluation bands</title>
<desc id="d">Evaluation bands in pawns from White's view, mirrored for Black: roughly equal below 0.30, slight edge from 0.30 to 0.70, clear edge from 0.70 to 1.50, large edge from 1.50 to 2.00, winning from 2.00. An edge belongs to the band above it. A band claim holds 15 cp past its edges, so clearly better is accepted from 0.55 to 1.65.</desc>
